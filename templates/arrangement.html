<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Ableton Web Remote - Arrangement Conduite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101215">
  <style>
    :root {
  --bg:#0d1014;
  --panel:#171b21;
  --text:#f3f4f6;
  --muted:#99a1ad;
  --border:#2c3440;
  --go1:#34d399;
  --go2:#15803d;
  --stop1:#a63a3a;
  --stop2:#6f1d1d;
  --nav1:#334155;
  --nav2:#1e293b;
  --grey1:#4f8fc9;
  --grey2:#2563eb;
  --amber:#f6ad55;
  --purple1:#6d28d9;
  --purple2:#4c1d95;
}
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overflow-x:hidden; }
    body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 8px);
}

.wrap {
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: calc(100vh - 14px);
  min-height: calc(100dvh - 14px);
}

.status {
  min-height: 14px;
  text-align: center;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
}

.status.connected { color: #8bc34a; }
.status.disconnected { color: #ef9a9a; }

.midi-title-mode { grid-column:1 / -1; display:flex; justify-content:flex-end; align-items:center; gap:7px; color:var(--muted); font-size:10px; }
.midi-title-mode select { min-height:28px; border:1px solid var(--border); border-radius:8px; background:#15181d; color:var(--text); font-size:10px; padding:3px 8px; }

.topnav {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 3px;
}

.topnav a {
  text-align: center;
  color: var(--text);
  text-decoration: none;
  font-weight: 900;
  font-size: 9px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 8px;
  padding: 4px 3px;
}

.topnav a.active {
  background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
  border-color: #60a5fa;
  color: white;
  box-shadow: 0 0 14px rgba(59,130,246,.45);
}

.card {
  background: linear-gradient(180deg, #1a1f27 0%, #12161c 100%);
  border: 1.5px solid #2e3744;
  border-radius: 18px;
  padding: 20px 16px;
  text-align: center;
  box-shadow: 0 8px 18px rgba(0,0,0,.20);
}

.label {
  color: var(--muted);
  font-size: 13px;
  letter-spacing: .07em;
  text-transform: uppercase;
  font-weight: 900;
  margin-bottom: 8px;
}

.scene-name {
  color: var(--text);
  font-size: clamp(32px, 8.5vw, 66px);
  font-weight: 1000;
  line-height: 1.02;
  word-break: break-word;
  min-height: 1em;
}

.current .scene-name { color: var(--amber); }
.next .scene-name { color: var(--text); }
.next .scene-name {
  font-size: clamp(28px, 7.6vw, 58px);
  line-height: 1.02;
}

.next {
  border-color: #3b82f6;
  box-shadow:
    0 0 16px rgba(59,130,246,.20),
    0 8px 18px rgba(0,0,0,.20),
    inset 0 0 10px rgba(59,130,246,.06);
}

.next.next-selected {
  animation: nextCardPulse .34s ease;
}

@keyframes nextCardPulse {
  0% {
    transform: scale(1);
    box-shadow:
      0 0 16px rgba(59,130,246,.20),
      0 8px 18px rgba(0,0,0,.20),
      inset 0 0 10px rgba(59,130,246,.06);
  }
  50% {
    transform: scale(1.02);
    box-shadow:
      0 0 28px rgba(59,130,246,.38),
      0 10px 20px rgba(0,0,0,.22),
      inset 0 0 14px rgba(96,165,250,.12);
  }
  100% {
    transform: scale(1);
    box-shadow:
      0 0 16px rgba(59,130,246,.20),
      0 8px 18px rgba(0,0,0,.20),
      inset 0 0 10px rgba(59,130,246,.06);
  }
}

.meta {
  color: var(--muted);
  margin-top: 6px;
  font-size: 13px;
  font-weight: 900;
}

.big-go {
  width: 100%;
  min-height: clamp(76px, 10.5vh, 96px);
  border-radius: 18px;
  font-size: clamp(34px, 8vw, 46px);
  letter-spacing: .03em;
  text-shadow: 0 1px 0 rgba(0,0,0,.18);
  position: relative;
  overflow: hidden;
}

.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}

.transport-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.transport-toggle {
  min-height: clamp(58px, 7.5vh, 72px);
  font-size: clamp(17px, 4vw, 22px);
  letter-spacing: .02em;
  color: #fff4df !important;
  border-color: rgba(255,184,77,.68) !important;
  background: linear-gradient(180deg, #7a5420, #432d17) !important;
}

.transport-toggle.transport-paused {
  color: #07160c !important;
  background: linear-gradient(180deg, #72e892 0%, #34b85a 100%) !important;
  border-color: rgba(114,232,146,.72) !important;
  animation: arrangementTransportPausePulse 1.1s infinite;
}

@keyframes arrangementTransportPausePulse {
  0%, 100% {
    transform: scale(1);
    filter: brightness(1);
    box-shadow:
      0 0 10px rgba(89,222,123,.30),
      0 0 18px rgba(52,184,90,.16);
  }
  50% {
    transform: scale(1.015);
    filter: brightness(1.08);
    box-shadow:
      0 0 22px rgba(114,232,146,.55),
      0 0 34px rgba(52,184,90,.26);
  }
}

.grid3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
}

button {
  min-height: clamp(52px, 7vh, 68px);
  border: 0;
  border-radius: 15px;
  color: white;
  font-size: clamp(16px, 3.8vw, 20px);
  font-weight: 1000;
  touch-action: manipulation;
  user-select: none;
  cursor: pointer;
}

button:active {
  transform: scale(.97);
  filter: brightness(1.15);
}

button:disabled {
  opacity: .55;
}

.go {
  background: linear-gradient(180deg, #3ddc97 0%, #22c55e 42%, #15803d 100%);
  box-shadow:
    0 0 16px rgba(34,197,94,.20),
    0 10px 22px rgba(0,0,0,.24),
    inset 0 1px 0 rgba(255,255,255,.16);
  border: 1px solid rgba(255,255,255,.10);
}

.stop {
  background: linear-gradient(180deg, var(--stop1), var(--stop2));
}

.nav {
  background: linear-gradient(180deg, #60a5fa 0%, #2563eb 100%);
  box-shadow:
    0 0 14px rgba(37,99,235,.24),
    0 8px 18px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.14);
  border: 1px solid rgba(255,255,255,.10);
}

.grey {
  background: linear-gradient(180deg, #5b8fc4 0%, #2f5f91 100%);
  border: 1px solid rgba(147,197,253,.35);
  box-shadow:
    0 0 10px rgba(91,143,196,.24),
    0 8px 18px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.12);
}

.purple {
  background: linear-gradient(180deg, #ff9800, #ef6c00);
  box-shadow: 0 0 18px rgba(255,152,0,.55);
}

.arrangement-indicator {
  min-height: clamp(58px, 7.5vh, 72px);
  border-radius: 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#1b1204;
  font-size:clamp(14px,3.4vw,18px);
  font-weight:1000;
  letter-spacing:.02em;
  background:linear-gradient(180deg,#ffb74d 0%,#ef6c00 100%);
  box-shadow:0 0 10px rgba(255,183,77,.25);
  flex-direction:column;
  line-height:1.1;
  text-align:center;
  padding:8px;
}

.arrangement-indicator small {
  display:block;
  margin-top:5px;
  color:rgba(27,18,4,.76);
  font-size:9px;
  font-weight:800;
  letter-spacing:.01em;
}

.select-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
}

select {
  width: 100%;
  min-height: 44px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.16);
  background: #15181d;
  color: var(--text);
  font-size: 14px;
  font-weight: 900;
  padding: 0 8px;
}

.choose {
  min-height: 44px;
  padding: 0 12px;
  font-size: 13px;
  background: linear-gradient(180deg, #f6ad55 0%, #dd7a1f 100%);
  color: #171717;
  box-shadow: 0 6px 14px rgba(221,122,31,.18);
}

.small {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
  text-align: center;
}

body.is-arrangement-playing .card.current {
  background: linear-gradient(180deg, #4a2f0f 0%, #221708 100%);
  border-color: #ffb74d;
  color: #fff3d6;
  box-shadow:
    0 0 40px rgba(255,183,77,.95),
    0 0 70px rgba(255,183,77,.45),
    inset 0 0 20px rgba(255,183,77,.20);
  text-shadow: 0 0 14px rgba(255,183,77,.80);
}

body.is-arrangement-playing .card.current .label,
body.is-arrangement-playing .card.current .scene-name {
  color: #ffdda8;
}

body.is-arrangement-playing .card.current .meta {
  color: #ffd7a3;
}

body.is-arrangement-paused .card.current {
  background: linear-gradient(180deg, #2b2417 0%, #17130d 100%);
  border-color: #f6d28b;
  color: #fce7b2;
  animation: arrangementPausePulse 1.2s infinite;
}

@keyframes arrangementPausePulse {
  0%, 100% {
    box-shadow:
      0 0 10px rgba(246,210,139,.20),
      inset 0 0 10px rgba(246,210,139,.06);
  }
  50% {
    box-shadow:
      0 0 18px rgba(246,210,139,.38),
      inset 0 0 14px rgba(246,210,139,.12);
  }
}

@media (orientation:portrait) and (max-width: 430px) {
  .main {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .wrap {
    justify-content: flex-start;
  }

  .small {
    margin-top: auto;
    font-size: 10px;
    line-height: 1.2;
  }
}

@media (orientation:landscape) {
  body { padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 10px); }
  .wrap { max-width:980px; gap:8px; }
  .topnav { gap:4px; }
  .topnav a { font-size:10px; border-radius:9px; padding:5px 4px; }
  .main { display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start; }
  .card { padding:18px 20px; }
  button { min-height:56px; font-size:18px; border-radius:18px; }
  .big-go { min-height:96px; font-size:42px; }
  .scene-name { font-size:clamp(30px,6vw,54px); }
  .next .scene-name { font-size:clamp(26px,5vw,46px); }
  .small { display:none; }
}


    /* Program Change — définition unique. */
    .midi-returns {
      display:grid !important;
      grid-template-columns:repeat(2,minmax(0,1fr)) !important;
      gap:6px !important;
      align-items:stretch !important;
      min-height:0 !important;
    }

    .midi-return {
      box-sizing:border-box !important;
      position:relative;
      min-width:0 !important;
      min-height:48px;
      height:48px;
      padding:4px 8px 5px;
      border:1px solid var(--border);
      border-radius:9px !important;
      overflow:hidden !important;
      background:#15181d;
      transition:border-color .16s,background .16s,box-shadow .16s;
    }

    .midi-return-heading {
      display:flex;
      align-items:baseline;
      gap:clamp(12px,4vw,28px);
      min-width:0;
      height:21px;
    }

    .midi-return-console {
      display:block !important;
      margin:0 !important;
      padding:0 !important;
      flex:0 0 auto;
      font-size:11px !important;
      line-height:1;
      font-weight:900 !important;
      letter-spacing:.08em !important;
    }

    .midi-return strong {
      display:block !important;
      min-width:0;
      margin:0 !important;
      padding:0 !important;
      line-height:20px;
    }

    .midi-return-memory {
      display:block !important;
      font-size:20px;
      line-height:20px;
      font-weight:900;
    }

    .midi-return-main-title {
      display:block !important;
      min-width:0 !important;
      overflow:hidden !important;
      text-overflow:ellipsis !important;
      white-space:nowrap !important;
      font-size:12.5px;
      line-height:16px;
      font-weight:750;
      color:#b8cbe3;
    }

    .midi-return-state {
      display:block !important;
      min-height:0 !important;
      position:absolute;
      width:1px;
      height:1px;
      margin:-1px;
      padding:0 !important;
      overflow:hidden !important;
      clip:rect(0 0 0 0);
      white-space:nowrap;
    }

    #webCl5Return,
    #arrCl5Return {
      --console-accent:#9b6bd6;
      --console-text:#c09af2;
    }

    #webQl1Return,
    #arrQl1Return {
      --console-accent:#3e9eac;
      --console-text:#63c7d4;
    }

    .midi-return .midi-return-console,
    .midi-return .midi-return-memory {
      color:var(--console-text) !important;
    }
    .midi-returns{grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));max-height:310px;overflow-y:auto}
    .midi-return{min-width:0}
    .midi-return-console{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .midi-return.device-unavailable{opacity:.62;filter:saturate(.72);animation:none!important}

    .midi-return::before {
      content:"";
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
      opacity:0;
      background:var(--console-accent);
    }

    .midi-return > * {
      position:relative;
      z-index:1;
    }

    .midi-return.state-idle {
      border-color:var(--console-accent) !important;
      background:#15181d !important;
      box-shadow:none !important;
    }

    .midi-return.state-waiting {
      border-color:var(--console-accent) !important;
      background:color-mix(in srgb, var(--console-accent) 7%, #15181d) !important;
      box-shadow:0 0 0 1px color-mix(in srgb, var(--console-accent) 22%, transparent) !important;
      animation:midiWaitingPulse 1.6s ease-in-out infinite alternate !important;
    }

    .midi-return.state-waiting.recall-pulse::before {
      animation:midiWaitingPulse 1.6s ease-in-out infinite alternate !important;
    }

    .midi-return.state-confirmed {
      border-color:var(--console-accent) !important;
      background:color-mix(in srgb, var(--console-accent) 18%, #15181d) !important;
      box-shadow:
        0 0 0 2px color-mix(in srgb, var(--console-accent) 24%, transparent),
        0 0 14px color-mix(in srgb, var(--console-accent) 30%, transparent) !important;
      animation:midiConfirmedPulse .65s ease-out 1 !important;
    }

    .midi-return.state-mismatch {
      border-color:var(--console-text) !important;
      background:color-mix(in srgb, var(--console-accent) 14%, #15181d) !important;
      box-shadow:
        0 0 0 2px color-mix(in srgb, var(--console-accent) 34%, transparent),
        0 0 18px color-mix(in srgb, var(--console-accent) 38%, transparent) !important;
      animation:midiMismatchPulse .65s ease-in-out infinite alternate !important;
    }

    .midi-return.state-timeout {
      border-color:var(--console-accent) !important;
      background:#15181d !important;
      box-shadow:0 0 0 1px color-mix(in srgb, var(--console-accent) 20%, transparent) !important;
      animation:none !important;
    }

    @keyframes midiConfirmedPulse {
      0% { transform:scale(1); filter:brightness(.94); background:color-mix(in srgb, var(--console-accent) 12%, #15181d); box-shadow:none; }
      38% {
        transform:scale(1.012);
        filter:brightness(1.22);
        background:color-mix(in srgb, var(--console-accent) 34%, #15181d);
        box-shadow:0 0 24px color-mix(in srgb, var(--console-accent) 55%, transparent);
      }
      100% { transform:scale(1); filter:brightness(1); background:color-mix(in srgb, var(--console-accent) 18%, #15181d); }
    }

    @keyframes midiMismatchPulse {
      from {
        transform:scale(1);
        filter:brightness(.82);
        background:color-mix(in srgb, var(--console-accent) 6%, #15181d);
        box-shadow:0 0 8px color-mix(in srgb, var(--console-accent) 18%, transparent);
      }
      to {
        transform:scale(1.008);
        filter:brightness(1.22);
        background:color-mix(in srgb, var(--console-accent) 36%, #15181d);
        border-color:var(--console-text);
        box-shadow:
          0 0 0 2px color-mix(in srgb, var(--console-accent) 42%, transparent),
          0 0 22px color-mix(in srgb, var(--console-accent) 52%, transparent);
      }
    }

    @keyframes midiWaitingPulse {
      from {
        filter:brightness(.88);
        background:color-mix(in srgb, var(--console-accent) 5%, #15181d);
        border-color:color-mix(in srgb, var(--console-accent) 48%, #15181d);
        box-shadow:
          0 0 0 1px color-mix(in srgb, var(--console-accent) 12%, transparent);
      }
      to {
        filter:brightness(1.12);
        background:color-mix(in srgb, var(--console-accent) 24%, #15181d);
        border-color:var(--console-accent);
        box-shadow:
          0 0 0 2px color-mix(in srgb, var(--console-accent) 32%, transparent),
          0 0 16px color-mix(in srgb, var(--console-accent) 30%, transparent);
      }
    }


    @media (prefers-reduced-motion:reduce) {
      .midi-return.state-waiting {
        animation-duration:1.6s !important;
        animation-iteration-count:infinite !important;
      }

      .midi-return.state-mismatch {
        animation-iteration-count:infinite !important;
      }
    }

    @media (max-width:390px) {
      .midi-returns {
        grid-template-columns:repeat(2,minmax(0,1fr)) !important;
      }

      .midi-return {
        height:48px;
        padding:4px 6px 5px;
      }

      .midi-return-memory {
        font-size:19px;
      }

      .midi-return-main-title {
        font-size:11.5px !important;
      }
    }

  <script src="/static/midi-return-visual.js?v=20260829-visual-recall-4s"></script>
  <script>
    const statusEl = document.getElementById('status');
    const currentNameEl = document.getElementById('currentName');
    const currentMetaEl = document.getElementById('currentMeta');
    const currentCardEl = document.getElementById('currentCard');
    const nextNameEl = document.getElementById('nextName');
    const ltcTimecodeEl = document.getElementById('ltcTimecode');
    const nextMetaEl = document.getElementById('nextMeta');
    const nextCardEl = document.querySelector('.card.next');
    const arrangementDevices = document.getElementById('arrangementDevices');

    const markerSelectEl = document.getElementById('markerSelect');
    const gotoBtn = document.getElementById('gotoBtn');
    const goBtn = document.getElementById('goBtn');
    const previewBtn = document.getElementById('previewBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pauseToggleBtn = document.getElementById('pauseToggleBtn');
    const transportButtons = [...document.querySelectorAll('button[data-action]')];

    let busy = false;
    let lastState = null;
    let markers = [];
    let markerSignature = '';
    let currentIndex = -1;
    let preparedIndex = 0;
    let nextWasManuallySelected = false;
    let markerSelectIsOpen = false;
    let goConfirmationFailed = false;

    let arrangementReturnActive = false;
    let latestArrangementTime = 0;
    let latestArrangementRemainingSeconds = null;
    let latestArrangementTimeSeconds = 0;
    let lastAcceptedGeneration = -1;

    function resetArrangementUiForGeneration() {
      markers = [];
      markerSignature = '';
      currentIndex = -1;
      preparedIndex = -1;
      nextWasManuallySelected = false;
      markerSelectIsOpen = false;
      goConfirmationFailed = false;
      arrangementReturnActive = false;

      currentNameEl.textContent = '—';
      nextNameEl.textContent = '—';
      currentMetaEl.textContent = '';
      nextMetaEl.textContent = '';
      if (markerSelectEl) markerSelectEl.innerHTML = '';
      document.body.classList.remove('is-arrangement-playing', 'is-arrangement-paused');
      if (currentCardEl) currentCardEl.classList.remove('is-playing', 'is-paused');
      if (nextCardEl) nextCardEl.classList.remove('is-prepared', 'next-selected');
    }

    function acceptStateGeneration(state) {
      const generation = Number(state && state.set_generation);
      if (!Number.isInteger(generation) || generation < lastAcceptedGeneration) {
        if (state && state.generation_debug) {
          console.warn('[SET_GENERATION] stale_response_rejected', {
            interface: 'arrangement', received: generation, current: lastAcceptedGeneration
          });
        }
        return false;
      }
      if (generation > lastAcceptedGeneration) {
        if (state && state.generation_debug) {
          console.info('[SET_GENERATION] generation_accepted', {
            interface: 'arrangement', previous: lastAcceptedGeneration, generation
          });
        }
        lastAcceptedGeneration = generation;
        resetArrangementUiForGeneration();
      }
      return true;
    }

    function setStatus(text, connected) {
      statusEl.textContent = text;
      statusEl.classList.toggle('connected', connected);
      statusEl.classList.toggle('disconnected', !connected);
    }

    async function fetchJSON(url, options = {}, timeoutMs = 2500) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, {...options, cache:'no-store', signal:controller.signal});
        let data = null;
        try { data = await res.json(); } catch (_) {}
        if (!res.ok) throw new Error((data && data.message) || 'Erreur serveur');
        return data;
      } finally { clearTimeout(timeout); }
    }

    function cleanTitle(value) {
      const raw = value && value !== '—' ? String(value).trim() : '';
      if (!raw) return '—';
      return raw.split(';')[0].trim() || raw;
    }

    function markerLabel(marker) {
  if (!marker) return '—';
  return cleanTitle(marker.name || 'Repère');
}

    function formatConduiteDuration(seconds) {
      const value = Math.max(0, Number(seconds) || 0);
      const total = Math.floor(value);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;

      if (hours > 0) {
        return String(hours).padStart(2, '0') + ':' +
          String(minutes).padStart(2, '0') + ':' +
          String(secs).padStart(2, '0');
      }

      return String(minutes).padStart(2, '0') + ':' +
        String(secs).padStart(2, '0');
    }

    function markerDuration(index) {
      if (
        index < 0 ||
        index >= markers.length ||
        !markers[index]
      ) return null;

      const start = Number(markers[index].time || 0);

      if (index + 1 >= markers.length || !markers[index + 1]) {
        return null;
      }

      const end = Number(markers[index + 1].time || 0);
      const duration = end - start;

      return Number.isFinite(duration) && duration >= 0
        ? duration
        : null;
    }

    function normalizeDurationName(value) {
      return String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/\bcancans\b/g, 'cancan')
        .replace(/\btraditionnel(?:le)?\b/g, 'tradi')
        .replace(/\btraditional\b/g, 'tradi')
        .replace(/\b\d+\b/g, ' ')
        .replace(/\b(?:bpm|key|db)\b/g, ' ')
        .replace(/[^a-z0-9]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function durationFromMappedTitle(value) {
      const raw = String(value || '');
      const match = raw.match(/(?:^|[;\s])(\d{1,2}):(\d{2})\s*$/);
      if (!match) return null;

      const minutes = Number(match[1]);
      const seconds = Number(match[2]);

      if (!Number.isFinite(minutes) || !Number.isFinite(seconds) || seconds >= 60) {
        return null;
      }

      return minutes * 60 + seconds;
    }

    function mappedDurationForMarker(marker) {
      if (!marker || !lastState) return null;

      const wanted = normalizeDurationName(marker.name);
      if (!wanted) return null;

      const wantedTokens = wanted.split(' ').filter(Boolean);
      const sceneMap = lastState.console_scene_map || {};

      let best = null;

      for (const consoleMap of Object.values(sceneMap)) {
        if (!consoleMap || typeof consoleMap !== 'object') continue;

        for (const entries of Object.values(consoleMap)) {
          if (!Array.isArray(entries)) continue;

          for (const entry of entries) {
            const duration = durationFromMappedTitle(entry && entry.title);
            if (duration === null) continue;

            const candidate = normalizeDurationName(entry.title);
            if (!candidate) continue;

            const candidateTokens = candidate.split(' ').filter(Boolean);

            let score = 0;
            for (const token of wantedTokens) {
              if (candidateTokens.includes(token)) score += 1;
            }

            if (candidate === wanted) score += 10;
            else if (candidate.includes(wanted) || wanted.includes(candidate)) score += 5;

            if (!best || score > best.score) {
              best = { score, duration, title: entry.title };
            }
          }
        }
      }

      return best && best.score >= Math.max(1, Math.ceil(wantedTokens.length * 0.6))
        ? best.duration
        : null;
    }

    function renderConduiteTimes(current, currentIdx, next, nextIdx) {
      const currentDuration = mappedDurationForMarker(current);

      if (
        current &&
        currentIdx >= 0 &&
        currentDuration !== null
      ) {
        const markerStartSeconds =
          Number(current.time || 0) / 2;

        const elapsed =
          Math.max(0, latestArrangementTimeSeconds - markerStartSeconds);

        const remaining =
          Math.max(0, currentDuration - elapsed);

        currentMetaEl.textContent =
          'Restant ' + formatConduiteDuration(remaining);
      } else {
        currentMetaEl.textContent = '';
      }

      const nextDuration = mappedDurationForMarker(next);

      if (
        next &&
        nextIdx >= 0 &&
        nextDuration !== null
      ) {
        nextMetaEl.textContent =
          'Durée ' + formatConduiteDuration(nextDuration);
      } else {
        nextMetaEl.textContent = '';
      }
    }

    function clampIndexes() {
      if (!markers.length) { currentIndex = -1; preparedIndex = -1; return; }
      if (currentIndex >= markers.length) currentIndex = markers.length - 1;
      if (preparedIndex < 0) preparedIndex = 0;
      if (preparedIndex >= markers.length) preparedIndex = markers.length - 1;
    }

    function renderConduite() {
  clampIndexes();

  const current = currentIndex >= 0 ? markers[currentIndex] : null;

  const displayNextIndex = preparedIndex;

  const next = displayNextIndex >= 0 ? markers[displayNextIndex] : null;

  currentNameEl.textContent = current
    ? cleanTitle(current.name || 'Repère')
    : '—';

  nextNameEl.textContent = next
    ? cleanTitle(next.name || 'Repère')
    : '—';

  // Informations de conduite compactes
  renderConduiteTimes(
    current,
    currentIndex,
    next,
    displayNextIndex
  );

  if (!markerSelectIsOpen && markerSelectEl && markers[displayNextIndex]) {
    markerSelectEl.value = String(displayNextIndex);
  }

  goBtn.disabled = busy || !next;
  previewBtn.disabled = busy || !next || displayNextIndex <= 0;
  nextBtn.disabled = busy || !next || displayNextIndex >= markers.length - 1;
  gotoBtn.disabled = busy || !markers.length;
    }

    function findIndexFromState(state) {
      if (!markers.length || !state) return -1;
      const name = String(state.arrangement_marker || '').trim();
      if (name && name !== '—') {
        const byName = markers.findIndex(m => String(m.name || '').trim() === name);
        if (byName >= 0) return byName;
      }
      const t = Number(state.arrangement_time || 0);
      let idx = -1;
      markers.forEach((m, i) => { if (Number(m.time || 0) <= t + 0.25) idx = i; });
      return idx;
    }

    function setMarkers(newMarkers, state) {
      const clean = Array.isArray(newMarkers) ? newMarkers : [];
      const signature = JSON.stringify(clean);

      if (signature !== markerSignature) {
        markerSignature = signature;
        markers = clean;
        const previousSelectValue = markerSelectEl.value;
        markerSelectEl.innerHTML = '';

        markers.forEach((marker, index) => {
          const option = document.createElement('option');
          option.value = String(index);
          option.textContent = markerLabel(marker);
          markerSelectEl.appendChild(option);
        });

        if (markerSelectIsOpen && previousSelectValue !== '' && markers[Number(previousSelectValue)]) {
          markerSelectEl.value = previousSelectValue;
        }

        if (preparedIndex >= markers.length) {
          preparedIndex = markers.length ? markers.length - 1 : -1;
          nextWasManuallySelected = false;
        }
      }

      const detected = findIndexFromState(state);
      if (detected >= 0 && !goConfirmationFailed) {
        currentIndex = detected;
      }

      if (!markers.length) {
        currentIndex = -1;
        preparedIndex = -1;
        return;
      }

      // Une préparation manuelle reste en place pendant les rafraîchissements.
      if (!nextWasManuallySelected && !goConfirmationFailed) {
        preparedIndex = currentIndex >= 0
          ? Math.min(currentIndex + 1, markers.length - 1)
          : 0;
      }

      clampIndexes();
    }

    function advanceNextWhenPlayheadPassed(state) {
      if (!markers.length || !state) return;
      if (markerSelectIsOpen || nextWasManuallySelected || goConfirmationFailed) return;

      const playheadTime = Number(state.arrangement_time || 0);
      if (!Number.isFinite(playheadTime)) return;

      let displayNextIndex = preparedIndex;
      if (displayNextIndex < 0 || displayNextIndex >= markers.length) return;

      let advanced = false;
      const tolerance = 0.20;

      while (
        displayNextIndex < markers.length - 1 &&
        Number(markers[displayNextIndex] && markers[displayNextIndex].time || 0) <= playheadTime + tolerance
      ) {
        displayNextIndex += 1;
        advanced = true;
      }

      if (!advanced) return;

      preparedIndex = displayNextIndex;
      renderConduite();
    }

    // Helper: Preview/select a marker for "Aller à" without transport action
    function previewSelectedMarker(idx, animate = false, commit = true) {
      const marker = markers[idx];
      if (!marker) return;

      if (commit) {
        preparedIndex = idx;
        nextWasManuallySelected = true;
      }

      nextNameEl.textContent = cleanTitle(marker.name || 'Repère');
      nextMetaEl.textContent = '';

      if (animate && nextCardEl) {
        nextCardEl.classList.add('is-prepared');
        nextCardEl.classList.remove('next-selected');
        void nextCardEl.offsetWidth;
        nextCardEl.classList.add('next-selected');
      }

      setStatus('● Sélection prête : ' + cleanTitle(marker.name || 'Repère'), true);
    }

    function applyStatus(state) {
      if (!acceptStateGeneration(state)) return;
      lastState = state;
      if (window.CLRemoteLTC) window.CLRemoteLTC.render(ltcTimecodeEl, state);
      window.CLMidiReturnVisual.renderDeviceCards(arrangementDevices, window.CLMidiReturnVisual.devicesFromState(state), {
        surface: 'remote', idPrefix: 'arrDevice'
      });
      const connected = Boolean(state && state.connected);
      const arrangementMode = Boolean(state && state.play_mode === 'arrangement');
      if (arrangementMode) arrangementReturnActive = true;
      const playing = Boolean(state && state.is_playing && arrangementMode);
      const paused = Boolean(state && state.is_paused && arrangementMode && !state.is_playing);
      const returnedArrangementPlaying = Boolean(playing);

      document.body.classList.toggle('is-arrangement-playing', returnedArrangementPlaying);
      document.body.classList.toggle('is-arrangement-paused', arrangementReturnActive && paused);
      if (currentCardEl) {
        currentCardEl.classList.toggle('is-playing', returnedArrangementPlaying);
        currentCardEl.classList.toggle('is-paused', arrangementReturnActive && paused);
      }

      const modeLabel = document.getElementById('currentModeLabel');
      if (modeLabel) {
        modeLabel.textContent = returnedArrangementPlaying
          ? 'LECTURE ARRANGEMENT'
          : (arrangementReturnActive && paused ? 'ARRANGEMENT EN PAUSE' : 'ARRANGEMENT ARRÊTÉ');
      }
      const arrangementIndicatorTitle = document.getElementById('arrangementIndicatorTitle');
      if (arrangementIndicatorTitle) arrangementIndicatorTitle.textContent = arrangementMode ? 'ARRANGEMENT ACTIF' : 'ARRANGEMENT PRÊT';

      if (
        pauseToggleBtn &&
        !busy &&
        pendingArrangementDesired === null
      ) {
        renderArrangementTransport(playing);
      }

      setStatus((connected ? '● ' : '○ ') + ((state && state.message) || (connected ? 'Connecté' : 'Interface non connectée')), connected);
      latestArrangementTime = Math.max(
        0,
        Number(state && state.arrangement_time || 0)
      );

      latestArrangementRemainingSeconds =
        state &&
        state.arrangement_remaining_seconds !== null &&
        state.arrangement_remaining_seconds !== undefined
          ? Math.max(0, Number(state.arrangement_remaining_seconds))
          : null;

      latestArrangementTimeSeconds = Math.max(
        0,
        Number(state && state.arrangement_time_seconds || 0)
      );

      setMarkers(state && state.arrangement_markers, state);
      advanceNextWhenPlayheadPassed(state);
      // Debug block removed
      renderConduite();
    }

    async function update() {
      if (busy) return;
      try { applyStatus(await fetchJSON('/status', {}, 1800)); }
      catch (_) { setStatus('○ Interface non connectée', false); }
    }

    function setDisabled(value, keepGoAvailable = false) {
      busy = value;

      [...transportButtons, goBtn, previewBtn, nextBtn, gotoBtn]
      .forEach(b => {
        if (!b || b === pauseToggleBtn) return;

        if (b === goBtn && keepGoAvailable) {
          b.disabled = false;
          return;
        }

        b.disabled = value;
      });

      if (!value) renderConduite();
    }

    let arrangementDesiredPlaying = null;
    let pendingArrangementDesired = null;
    let arrangementGoInProgress = false;
    let activeArrangementAction = null;

    function renderArrangementTransport(playing) {
      arrangementDesiredPlaying = Boolean(playing);

      if (!pauseToggleBtn) return;

      pauseToggleBtn.textContent = arrangementDesiredPlaying
        ? '⏸ PAUSE'
        : '▶ LECTURE';

      pauseToggleBtn.classList.toggle(
        'transport-paused',
        !arrangementDesiredPlaying
      );
    }

    async function sendAction(payload) {
  if (busy) return;

  const action = payload && payload.action;

  if (
    action === 'pause' &&
    typeof payload.desired_playing === 'boolean'
  ) {
    arrangementDesiredPlaying = payload.desired_playing;
    renderArrangementTransport(arrangementDesiredPlaying);
  }

  if (action === 'back_to_arrangement') arrangementReturnActive = true;
  if (action === 'arrangement_play_marker') arrangementReturnActive = true;
  if (action === 'arrangement_toggle') arrangementReturnActive = true;

  activeArrangementAction = action;

  // Lecture/Pause ne doit jamais neutraliser visuellement le GO.
  // GO reste une commande indépendante et prioritaire.
  setDisabled(true, action === 'pause');
  try {
    let data = null;

    data = await fetchJSON('/action', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    }, 2200);

    if (data && data.state) {
      applyStatus(data.state);
      if (
        action === 'pause' &&
        pendingArrangementDesired === null
      ) {
        renderArrangementTransport(Boolean(
          data.state.is_playing &&
          data.state.play_mode === 'arrangement'
        ));
      }
    } else {
      await update();
    }
  } catch (_) {
    setStatus('○ Commande Arrangement impossible', false);
  } finally {
    setTimeout(() => {
      if (activeArrangementAction === action) {
        activeArrangementAction = null;
      }

      setDisabled(false);

      if (
        action === 'pause' &&
        pendingArrangementDesired !== null &&
        !arrangementGoInProgress
      ) {
        const queuedDesired = pendingArrangementDesired;
        pendingArrangementDesired = null;

        renderArrangementTransport(queuedDesired);

        sendAction({
          action: 'pause',
          desired_playing: queuedDesired,
          source: 'arrangement-play-pause'
        });
      } else {
        pendingArrangementDesired = null;
        update();
      }
    }, 80);
  }
}

    function payloadFor(marker, action) {
      return {action, time:marker.time, name:marker.name, source:marker.source, cue_index:marker.cue_index};
    }

async function runArrangementGo() {
  if (arrangementGoInProgress) return;
  arrangementGoInProgress = true;
  pendingArrangementDesired = null;

  // Si une commande Lecture/Pause est encore en vol, le GO est mémorisé
  // par cet appel et attend sa fin. On évite ainsi deux requêtes transport
  // concurrentes capables de s'annuler mutuellement côté Ableton.
  if (busy && activeArrangementAction === 'pause') {
    const deadline = Date.now() + 2600;
    while (
      busy &&
      activeArrangementAction === 'pause' &&
      Date.now() < deadline
    ) {
      await new Promise(resolve => setTimeout(resolve, 10));
    }

    if (busy) {
      arrangementGoInProgress = false;
      setStatus('○ GO en attente : transport occupé', false);
      return;
    }
  } else if (busy) {
    arrangementGoInProgress = false;
    return;
  }

  // À partir du clic GO, toute ancienne demande Pause/Lecture est annulée.

  const launchIndex = preparedIndex;

  const marker = markers[launchIndex];
  if (!marker) {
    arrangementGoInProgress = false;
    return;
  }

  arrangementReturnActive = true;
  if (nextCardEl) nextCardEl.classList.remove('is-prepared', 'next-selected');
  setDisabled(true);

  try {
    const result = await fetchJSON('/action', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payloadFor(marker, 'arrangement_play_marker'))
    }, 5000);
    if (!result || result.go_confirmed !== true) {
      throw new Error('GO non confirmé par Ableton');
    }

    goConfirmationFailed = false;
    currentIndex = launchIndex;
    preparedIndex = Math.min(launchIndex + 1, markers.length - 1);
    nextWasManuallySelected = false;

    arrangementReturnActive = true;
    renderArrangementTransport(true);

    renderConduite();
  } catch (error) {
    goConfirmationFailed = true;
    if (nextCardEl) nextCardEl.classList.add('is-prepared');
    setStatus('○ ' + (error && error.message || 'GO Arrangement non confirmé'), false);
  } finally {
    setTimeout(() => {
      // Les commandes Pause/Lecture reçues pendant le GO sont volontairement
      // ignorées : le GO doit rester prioritaire jusqu'à sa fin.
      pendingArrangementDesired = null;
      arrangementGoInProgress = false;
      setDisabled(false);
      update();
    }, 80);
  }
}

goBtn.addEventListener('click', runArrangementGo);

    previewBtn.addEventListener('click', () => {
      if (!markers.length) return;
      const idx = Math.max(preparedIndex - 1, 0);
      markerSelectIsOpen = false;
      previewSelectedMarker(idx, true, true);
    });

    nextBtn.addEventListener('click', () => {
      if (!markers.length) return;
      const idx = Math.min(preparedIndex + 1, markers.length - 1);
      previewSelectedMarker(idx, true, true);
    });

      markerSelectEl.addEventListener('focus', () => {
      markerSelectIsOpen = true;
});

      markerSelectEl.addEventListener('blur', () => {
      markerSelectIsOpen = false;
      renderConduite();
});

markerSelectEl.addEventListener('change', () => {
  const idx = Number(markerSelectEl.value || 0);
  markerSelectIsOpen = false;
  if (!markers[idx]) return;
  previewSelectedMarker(idx, true, true);
  renderConduite();
});

    markerSelectEl.addEventListener('input', () => {
      const idx = Number(markerSelectEl.value || 0);
      if (!markers[idx]) return;
      previewSelectedMarker(idx, false, true);
      renderConduite();
    });

    gotoBtn.addEventListener('click', () => {
      const idx = Number(markerSelectEl.value || 0);
      if (!markers[idx]) return;
      previewSelectedMarker(idx, true, true);
      renderConduite();
    });

    function runArrangementPlayPause() {
      if (arrangementGoInProgress) {
        setStatus('● GO en cours — commande Pause/Lecture ignorée', true);
        return Promise.resolve();
      }

      if (
        arrangementDesiredPlaying === null &&
        pendingArrangementDesired === null
      ) {
        return sendAction({
          action: 'pause',
          source: 'arrangement-play-pause'
        });
      }

      const confirmedPlaying = Boolean(
        lastAcceptedGeneration !== null &&
        arrangementDesiredPlaying
      );

      const currentPlaying = pendingArrangementDesired !== null
        ? pendingArrangementDesired
        : confirmedPlaying;

      const desiredPlaying = !currentPlaying;

      renderArrangementTransport(desiredPlaying);

      if (busy) {
        pendingArrangementDesired = desiredPlaying;

        setStatus(
          desiredPlaying
            ? '● Lecture Arrangement demandée…'
            : '● Pause Arrangement demandée…',
          true
        );

        return Promise.resolve();
      }

      return sendAction({
        action: 'pause',
        desired_playing: desiredPlaying,
        source: 'arrangement-play-pause'
      });
    }

    document.addEventListener('click', event => {
      const target = event.target instanceof Element
        ? event.target.closest('#pauseToggleBtn')
        : null;

      if (!target) return;

      event.preventDefault();
      runArrangementPlayPause();
    }, true);

    transportButtons.forEach(button => {
      if (button !== pauseToggleBtn) {
        button.addEventListener('click', () => sendAction({action:button.dataset.action}));
      }
    });

    function keyboardShortcutBlockReason(event) {
      if (event.repeat) return 'key-repeat';
      if (event.metaKey || event.altKey || event.ctrlKey) return 'modifier-key';
      const target = event.target instanceof Element ? event.target : document.activeElement;
      if (!target) return '';
      return (
        target.matches('input, textarea, select, [contenteditable]:not([contenteditable="false"])') ||
        target.closest('[contenteditable]:not([contenteditable="false"])')
      ) ? `editable-focus:${target.tagName || 'contenteditable'}` : '';
    }

    function keyboardDiagnosticLog(eventName, details = {}) {
      const record = { source: 'Arrangement', event: eventName, ...details };
      console.info(`[KEYBOARD][Arrangement] ${eventName}`, record);
      fetch('/keyboard-log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(record),
        keepalive: true
      }).catch(() => {});
    }

    keyboardDiagnosticLog('initialized', {
      diagnosticCase: 'INITIALIZED_CASE_4_EXCLUDED',
      timestamp: Date.now(),
      readyState: document.readyState,
      inIframe: window.top !== window,
      documentHasFocus: document.hasFocus(),
      windowHasFocus: typeof window.hasFocus === 'function' ? window.hasFocus() : document.hasFocus()
    });

    document.addEventListener('keydown', event => {
      const isTransportShortcut = event.code === 'Space' || event.key === ' ';
      const reason = keyboardShortcutBlockReason(event) || (busy && !isTransportShortcut ? 'busy' : '');
      keyboardDiagnosticLog('keydown', {
        diagnosticCase: reason ? 'CASE_2_REJECTED' : 'KEYDOWN_ACCEPTED',
        timestamp: Date.now(),
        key: event.key,
        code: event.code,
        repeat: event.repeat,
        target: event.target && event.target.tagName,
        activeElement: document.activeElement && document.activeElement.tagName,
        activeElementId: document.activeElement && document.activeElement.id,
        documentHasFocus: document.hasFocus(),
        windowHasFocus: typeof window.hasFocus === 'function' ? window.hasFocus() : document.hasFocus(),
        ignored: Boolean(reason),
        reason
      });
      if (reason) return;

      if (event.key === 'Enter') {
        event.preventDefault();
        event.stopPropagation();
        keyboardDiagnosticLog('invoke-go', { diagnosticCase: 'CASE_3_HANDLER_CALLED', timestamp: Date.now() });
        runArrangementGo();
        return;
      }

      if (event.code === 'Space' || event.key === ' ') {
        event.preventDefault();
        event.stopPropagation();
        keyboardDiagnosticLog('invoke-play-pause', { diagnosticCase: 'CASE_3_HANDLER_CALLED', timestamp: Date.now() });
        pauseToggleBtn.click();
        return;
      }

      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        event.stopPropagation();
        keyboardDiagnosticLog('invoke-preview', { diagnosticCase: 'CASE_3_HANDLER_CALLED', timestamp: Date.now() });
        previewBtn.click();
        return;
      }

      if (event.key === 'ArrowRight') {
        event.preventDefault();
        event.stopPropagation();
        keyboardDiagnosticLog('invoke-next', { diagnosticCase: 'CASE_3_HANDLER_CALLED', timestamp: Date.now() });
        nextBtn.click();
      }
    });

    renderConduite();
    window.addEventListener('DOMContentLoaded', () => {
      window.CLRemoteEnergy.startPolling(
        update,
        () => document.body.classList.contains('is-arrangement-playing'),
        { activeMs: 250, idleMs: 2500, hiddenMs: 15000, minActiveMs: 250 }
      );
    }, { once: true });
  </script>

<script id="cl-arrangement-xfader-test-script">
(() => {
  const box = document.getElementById('arrangementXfaderTest');
  if (!box) return;

  const slider = box.querySelector('.cl-arr-xfader-test-range');
  const stateEl = document.getElementById('arrangementXfaderTestState');

  if (!slider || !stateEl) return;

  let dragging = false;
  let sendTimer = null;
  let lastSentValue = null;
  let lastRemoteValue = null;

  function clamp(value) {
    const number = Number(value);
    if (!Number.isFinite(number)) return -1;
    return Math.max(-1, Math.min(1, number));
  }

  function percentFromValue(value) {
    return Math.round(((clamp(value) + 1) / 2) * 100);
  }

  function render(value) {
    const v = clamp(value);
    const pct = percentFromValue(v);

    slider.value = String(v);
    slider.setAttribute('aria-valuenow', String(v));

    box.dataset.value = String(v);

    if (v <= -0.95) {
      box.dataset.zone = 'a';
      stateEl.textContent = 'A · PLAYBACK';
    } else if (v >= 0.95) {
      box.dataset.zone = 'b';
      stateEl.textContent = 'B · PLAYBACK + VOIX';
    } else {
      box.dataset.zone = 'mix';
      stateEl.textContent = 'VOIX ' + pct + ' %';
    }
  }

  async function sendValue(value) {
    const v = clamp(value);

    if (
      lastSentValue !== null &&
      Math.abs(v - lastSentValue) < 0.0001
    ) {
      return;
    }

    lastSentValue = v;

    try {
      const response = await fetch('/action', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        cache: 'no-store',
        body: JSON.stringify({
          action: 'xfade_value',
          value: v
        })
      });

      const data = await response.json().catch(() => null);

      if (!response.ok) {
        throw new Error(
          data && data.message
            ? data.message
            : 'Commande X-Fader refusée'
        );
      }

      if (
        !dragging &&
        data &&
        data.state &&
        typeof data.state.crossfader !== 'undefined'
      ) {
        const confirmed = clamp(data.state.crossfader);
        lastRemoteValue = confirmed;
        render(confirmed);
      }
    } catch (error) {
      console.warn('[ARRANGEMENT X-FADER] envoi impossible', error);
    }
  }

  function queueSend(value) {
    const v = clamp(value);

    clearTimeout(sendTimer);

    sendTimer = setTimeout(() => {
      sendValue(v);
    }, 70);
  }

  slider.addEventListener('pointerdown', () => {
    dragging = true;
  });

  window.addEventListener('pointerup', () => {
    if (!dragging) return;

    dragging = false;

    clearTimeout(sendTimer);
    sendValue(slider.value);
  });

  slider.addEventListener('input', () => {
    const value = clamp(slider.value);

    render(value);
    queueSend(value);
  });

  slider.addEventListener('change', () => {
    clearTimeout(sendTimer);
    sendValue(slider.value);
  });

  async function syncFromStatus() {
    if (dragging) return;

    try {
      const response = await fetch('/status', {
        cache: 'no-store'
      });

      if (!response.ok) return;

      const state = await response.json();

      if (
        typeof state.crossfader === 'undefined' ||
        state.crossfader === null
      ) {
        return;
      }

      const remoteValue = clamp(state.crossfader);

      if (
        lastRemoteValue === null ||
        Math.abs(remoteValue - lastRemoteValue) >= 0.001
      ) {
        lastRemoteValue = remoteValue;
        render(remoteValue);
      }
    } catch (_) {
      // Le reste de la télécommande gère déjà l'état de connexion.
    }
  }

  render(slider.value);
  syncFromStatus();

  window.setInterval(syncFromStatus, 500);

  console.info(
    '[ARRANGEMENT X-FADER] vrai contrôle Ableton actif'
  );
})();
</script>
