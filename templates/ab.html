<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Ableton Web Remote - A/B</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <style>
    :root {
      --bg: #050505;
      --panel: #0b0b0b;
      --text: #ffffff;
      --border: rgba(255,255,255,0.12);
      --session: #7CFF00;
      --prev: #C86BFF;
      --next: #FFB000;
      --stop: #FF2B2B;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body {
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      overflow-x:hidden;
    }
    body {
      min-height:100vh;
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 110px);
    }
    .wrap {
      width:100%;
      max-width:390px;
      min-height:calc(100vh - 14px);
      min-height:calc(100dvh - 14px);
      margin:0 auto;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .status {
      height:18px;
      line-height:18px;
      text-align:center;
      color:var(--text);
      font-size:12px;
      font-weight:800;
      border-bottom:1px solid var(--border);
      user-select:none;
    }

    .status.connected { color: var(--session); }
    .status.disconnected { color: var(--stop); }

    .topnav {
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:6px;
      user-select:none;
    }

    .topnav a {
      text-align:center;
      color:var(--text);
      text-decoration:none;
      font-weight:900;
      font-size:11px;
      letter-spacing:.06em;
      text-transform:uppercase;
      background:rgba(255,255,255,.045);
      border:1px solid rgba(255,255,255,.12);
      border-radius:10px;
      padding:7px 4px;
      box-shadow:inset 0 0 12px rgba(255,255,255,.025);
    }

    .topnav a.active {
      color:var(--session);
      border-color:rgba(124,255,0,.38);
      box-shadow:0 0 12px rgba(124,255,0,.12), inset 0 0 14px rgba(124,255,0,.04);
    }


    .deck-screen {
      flex: 0 1 auto;
      min-height: 0;
      border: 1px solid rgba(124,255,0,0.28);
      box-shadow: 0 0 22px rgba(124,255,0,0.10), inset 0 0 34px rgba(124,255,0,0.035);
    }

    .screen-topline {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      color:#9ca3af;
      font-size:10px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .screen-pill {
      border:1px solid rgba(124,255,0,.38);
      color:var(--session);
      border-radius:999px;
      padding:4px 8px;
      box-shadow:0 0 10px rgba(124,255,0,.12);
    }

    .display-stack {
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:stretch;
      justify-content:center;
      gap:10px;
    }

    .title-box {
      border-radius:14px;
      padding:12px 10px;
      background:rgba(255,255,255,0.025);
    }

    .title-box-current {
      border:2px solid rgba(255,149,0,.78);
      box-shadow:0 0 16px rgba(255,149,0,.18), inset 0 0 14px rgba(255,149,0,.045);
    }

    .title-box-current.is-playing {
      border-color:rgba(255,149,0,1);
      box-shadow:0 0 28px rgba(255,149,0,.45), inset 0 0 20px rgba(255,149,0,.10);
    }

    .title-box-next {
      border:2px solid rgba(66,165,245,.86);
      box-shadow:0 0 16px rgba(66,165,245,.22), inset 0 0 14px rgba(66,165,245,.05);
    }
    .card {
      background: var(--panel);
      border:1px solid var(--border);
      border-radius:16px;
      padding:12px 12px;
      text-align:center;
      box-shadow: 0 0 12px rgba(255,255,255,0.05);
      background: linear-gradient(180deg,#0b0b0b 0%,#050505 100%);
      display:flex;
      flex-direction: column;
      justify-content: center;
      gap:12px;
      user-select:none;
    }
    .now-label {
      font-size:11px;
      font-weight:900;
      letter-spacing:0.12em;
      text-transform:uppercase;
      opacity:0.75;
      color:#9ca3af;
      user-select:none;
    }
    .now-title {
      font-size: clamp(22px, 7.2vw, 42px);
      font-weight: 900;
      line-height: 1.05;
      color: var(--text);
      word-break: break-word;
      min-height: 1em;
      user-select:text;
      text-shadow: 0 0 18px rgba(255,255,255,0.18);
    }
    .arrow {
      font-size: 26px;
      line-height: 1;
      color: var(--session);
      text-shadow: 0 0 12px rgba(124,255,0,0.45);
      user-select:none;
    }
    .next-title {
      font-size: clamp(17px, 5.2vw, 28px);
      font-weight: 800;
      color: #d1d5db;
      opacity: 1;
      min-height: 1em;
      user-select:text;
    }
    .current-remaining {
      display: block !important;
      min-height: 1em;
      margin-top: 3px;
      color: #f4d58d !important;
      font-size: clamp(11px, 3vw, 14px);
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      line-height: 1.1;
      opacity: 0.95;
      text-shadow: 0 0 9px rgba(244, 213, 141, 0.18);
      user-select: none;
    }
    .next-duration {
      display: block !important;
      min-height: 1em;
      margin-top: 3px;
      color: #9dd7ff !important;
      font-size: clamp(11px, 3vw, 14px);
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      line-height: 1.1;
      opacity: 0.95;
      text-shadow: 0 0 9px rgba(157, 215, 255, 0.20);
      user-select: none;
    }
    .counter {
      font-size: 14px;
      font-weight: 700;
      color: var(--session);
      opacity: 0.7;
      user-select:none;
      margin-top: auto;
    }
    .buttons-row {
      display: grid;
      grid-template-columns: 1fr 1.35fr 1fr;
      gap: 8px;
      user-select:none;
      align-items:stretch;
    }
    .buttons-dock {
      position:fixed;
      left:8px;
      right:8px;
      bottom:calc(env(safe-area-inset-bottom) + 8px);
      z-index:120;
      max-width:430px;
      margin-left:auto;
      margin-right:auto;
      background:rgba(11,11,11,.90);
      border:1px solid rgba(255,255,255,.10);
      border-radius:18px;
      padding:8px;
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      box-shadow:0 0 24px rgba(0,0,0,.45);
    }
    .button {
      border: 1.5px solid transparent;
      border-radius: 16px;
      color: var(--text);
      font-weight: 900;
      font-size: 18px;
      cursor: pointer;
      user-select:none;
      touch-action: manipulation;
      transition: box-shadow 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .button:disabled {
      opacity: 0.5;
      cursor: default;
      box-shadow: none !important;
    }
    .button-a {
      background-color: #2563EB;
      flex: 1.2;
      border-color: #60A5FA;
      box-shadow: 0 0 10px rgba(96,165,250,.45);
    }
    .button-center {
      background-color: #374151;
      flex: 0.9;
      border-color: #9CA3AF;
      box-shadow: 0 0 8px rgba(156,163,175,.28);
    }
    .button-b {
      background-color: #DC2626;
      flex: 1.2;
      border-color: #F87171;
      box-shadow: 0 0 10px rgba(248,113,113,.45);
    }

    .selector-pad {
      flex: 1.8;
      min-width: 0;
      display:flex;
      flex-direction:column;
      gap:8px;
      align-items:stretch;
      justify-content:center;
    }

    .scene-select {
      width:100%;
      min-height:38px;
      border-radius:12px;
      border:1px solid rgba(124,255,0,.28);
      background:#050505;
      color:#ffffff;
      font-size:13px;
      font-weight:850;
      padding:0 8px;
      outline:none;
      box-shadow:inset 0 0 12px rgba(124,255,0,.045);
    }
    .scene-select-panel {
      background:linear-gradient(180deg,#0b0b0b 0%,#050505 100%);
      border:1px solid rgba(124,255,0,.20);
      border-radius:14px;
      padding:8px 10px;
      box-shadow:0 0 12px rgba(124,255,0,.06), inset 0 0 12px rgba(124,255,0,.025);
    }

    .scene-select-panel .scene-select {
      min-height:44px;
      font-size:14px;
    }

    .knob-button {
    min-height:56px;
    min-width:0;
    width:100%;
    border-radius:18px;
    border:2px solid rgba(34,197,94,.92);
    background:linear-gradient(180deg, #166534 0%, #052e16 100%);
    color:#ffffff;
    font-size:22px;
    font-weight:1000;
    letter-spacing:.08em;
    text-transform:uppercase;
    box-shadow:0 0 26px rgba(34,197,94,.42), inset 0 0 18px rgba(255,255,255,.08);
    cursor:pointer;
    touch-action:manipulation;
    display:flex;
    align-items:center;
    justify-content:center;
}

    .knob-button:active {
      transform:scale(.97);
      filter:brightness(1.18);
    }
    .button:active {
      filter: brightness(1.15);
      transform: scale(0.97);
    }
    /* Crossfader styles */
    .crossfader-section {
      position:relative;
      width:100%;
      margin:8px 0 0 0;
      background:rgba(11,11,11,.82);
      border:1px solid var(--border);
      border-radius:16px;
      padding:10px 12px;
      user-select:none;
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      box-shadow:0 0 22px rgba(0,0,0,.35), 0 0 14px rgba(255,255,255,.05);
    }
    .crossfader-label {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text);
      opacity: 0.6;
      margin-bottom: 3px;
      user-select:none;
    }
    .crossfader-position {
      font-size: clamp(18px, 5vw, 28px);
      font-weight: 1000;
      color: var(--text);
      text-align: center;
      user-select:none;
    }
    .slider-panel {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 8px 10px;
      margin-top: 6px;
    }
    input[type="range"] {
      width: 100%;
      height: 34px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: pointer;
      touch-action: pan-y;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--prev) 0%, #757575 50%, var(--next) 100%);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.38), 0 0 14px rgba(255,255,255,0.06);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 30px;
      height: 30px;
      margin-top: -10px;
      border-radius: 50%;
      background: linear-gradient(180deg,#f8fafc 0%,#9ca3af 100%);
      border: 3px solid rgba(255,255,255,0.92);
      box-shadow: 0 6px 18px rgba(0,0,0,0.48), 0 0 0 5px rgba(255,255,255,0.08);
    }
    input[type="range"]:active::-webkit-slider-thumb {
      transform: scale(1.08);
      box-shadow: 0 8px 22px rgba(0,0,0,0.55), 0 0 0 7px rgba(255,255,255,0.12);
    }
    .row {
      display: flex;
      justify-content: space-between;
      color: var(--text);
      font-size: 12px;
      font-weight: 900;
      margin-top: 4px;
      user-select:none;
    }

    .ltc-panel {
      background: linear-gradient(180deg,#0b0b0b 0%,#050505 100%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 10px 12px;
      text-align:center;
      box-shadow: 0 0 14px rgba(124,255,0,0.08), inset 0 0 18px rgba(124,255,0,0.025);
      user-select:none;
      width:min(100%, 360px);
      margin-left:auto;
      margin-right:auto;
    }

    .ltc-label {
      color:#9ca3af;
      font-size:10px;
      font-weight:900;
      letter-spacing:.14em;
      text-transform:uppercase;
      margin-bottom:4px;
    }

    .ltc-timecode {
      color:var(--session);
      font-family:"SF Mono", Menlo, Monaco, Consolas, monospace;
      font-size:clamp(20px, 6vw, 36px);
      font-weight:1000;
      letter-spacing:.04em;
      line-height:1;
      text-shadow:0 0 14px rgba(124,255,0,.28);
    }
    .ltc-timecode[data-live="1"] {
      color:#7CFF00;
      text-shadow:0 0 18px rgba(124,255,0,.55);
    }

    .ltc-timecode[data-live="0"] {
      color:#6b7280;
      text-shadow:none;
    }
    .small {
      color: var(--text);
      font-size: 10px;
      line-height: 1.2;
      text-align: center;
      margin-top: 4px;
      margin-bottom: 0;
      user-select:none;
    }
    @media (orientation:portrait) and (max-width:430px) {
      .wrap { justify-content:flex-start; }
      .buttons-row { gap: 6px; }
      .button {
        min-height: 60px;
        font-size: 16px;
      }
      .button-go {
        flex: 2;
      }
      .button-prev, .button-next {
        flex: 1;
      }
      .button-stop {
        min-height: 60px;
        font-size: 18px;
        margin-top: 6px;
      }
      .now-title {
        font-size: clamp(26px, 9vw, 50px);
      }
      .arrow {
        font-size: 36px;
      }
      .next-title {
        font-size: clamp(20px, 7vw, 32px);
      }
    }
    @media (orientation:landscape) {
      body {
        padding: calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 90px) calc(env(safe-area-inset-left) + 10px);
      }
      .wrap {
        max-width: 900px;
        gap: 5px;
      }
      .buttons-row {
        gap: 10px;
      }
      .button {
        min-height: 34px;
        font-size: 15px;
        border-radius: 10px;
      }
      .button-go {
        flex: 2;
      }
      .button-prev, .button-next {
        flex: 1;
      }
      .button-stop {
        min-height: 34px;
        font-size: 16px;
        margin-top: 6px;
        border-radius: 10px;
      }
      .now-title {
        font-size: clamp(22px, 4.5vw, 36px);
      }
      .arrow {
        font-size: 24px;
      }
      .next-title {
        font-size: clamp(16px, 3.2vw, 24px);
      }
      .crossfader-section {
        width:100%;
        max-width:none;
        margin-top:6px;
      }
      .buttons-dock {
        left:calc(env(safe-area-inset-left) + 10px);
        right:calc(env(safe-area-inset-right) + 10px);
        max-width:900px;
      }
      .small {
        display: none;
      }
    }

    /* AB final compact layout — single source of truth */
    body {
      padding: 0 8px 4px 8px !important;
      overflow: hidden !important;
    }

    .wrap {
      width: 100% !important;
      max-width: 312px !important;
      min-height: 0 !important;
      height: auto !important;
      margin: 0 auto !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: flex-start !important;
      gap: 3px !important;
      overflow: hidden !important;
    }

    .status {
      height: 9px !important;
      line-height: 9px !important;
      font-size: 6px !important;
      font-weight: 800 !important;
      border-bottom: 0 !important;
      opacity: .58 !important;
    }

    .topnav {
      display: grid !important;
      grid-template-columns: 1fr 1fr 1fr !important;
      gap: 3px !important;
    }

    .topnav a {
      font-size: 7px !important;
      line-height: 1 !important;
      padding: 2px 2px !important;
      border-radius: 6px !important;
      letter-spacing: .035em !important;
    }

    .card,
    .deck-screen,
    .ltc-panel,
    .scene-select-panel,
    .crossfader-section,
    .buttons-dock {
      width: 100% !important;
      max-width: 312px !important;
      overflow: hidden !important;
    }

    .card.deck-screen {
      flex: 0 0 auto !important;
      min-height: 0 !important;
      max-height: none !important;
      padding: 4px 6px !important;
      gap: 1px !important;
      border-radius: 9px !important;
    }

    .screen-topline,
    .screen-pill,
    .counter,
    .small {
      display: none !important;
    }

    .display-stack {
      display: flex !important;
      flex-direction: column !important;
      gap: 2px !important;
      justify-content: flex-start !important;
    }

    .title-box {
      width: 100% !important;
      max-width: 296px !important;
      margin: 0 auto !important;
      padding: 10px 8px !important;
      border-radius: 7px !important;
      background: rgba(255,255,255,0.022) !important;
    }

    .title-box-current,
    .title-box-next {
      border-width: 1px !important;
    }

    .now-label {
      font-size: 6px !important;
      font-weight: 800 !important;
      letter-spacing: .075em !important;
      line-height: 1 !important;
      margin: 0 0 1px 0 !important;
      opacity: .62 !important;
    }

    .now-title {
      font-size: clamp(16px, 4.8vw, 22px) !important;
      font-weight: 850 !important;
      letter-spacing: .005em !important;
      line-height: .93 !important;
      min-height: 0 !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      word-break: normal !important;
    }

    .arrow {
      font-size: 8px !important;
      line-height: .7 !important;
      margin: -1px 0 !important;
    }

    .next-title {
      font-size: clamp(12px, 3.7vw, 17px) !important;
      font-weight: 780 !important;
      letter-spacing: .005em !important;
      line-height: .93 !important;
      min-height: 0 !important;
      color: rgba(248,250,252,.84) !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      word-break: normal !important;
    }

    .ltc-panel {
      margin: 1px auto 0 auto !important;
      padding: 2px 6px !important;
      border-radius: 8px !important;
    }

    .ltc-label {
      font-size: 5px !important;
      line-height: 1 !important;
      margin: 0 !important;
      opacity: .5 !important;
    }

    .ltc-timecode {
      font-size: clamp(10px, 3vw, 14px) !important;
      line-height: .9 !important;
    }

    .scene-select-panel {
      padding: 2px 5px !important;
      border-radius: 8px !important;
    }

    .scene-select,
    .scene-select-panel .scene-select {
      min-height: 20px !important;
      height: 20px !important;
      font-size: 8px !important;
      border-radius: 6px !important;
      padding: 0 5px !important;
    }

    .crossfader-section {
      margin: 2px auto 0 auto !important;
      padding: 10px 8px !important;
      border-radius: 8px !important;
    }

    .crossfader-label {
      font-size: 5px !important;
      line-height: 1 !important;
      margin: 0 0 1px 0 !important;
      opacity: .5 !important;
    }

    .crossfader-position {
      font-size: clamp(11px, 3.3vw, 16px) !important;
      line-height: .95 !important;
    }

    .slider-panel {
      margin-top: 1px !important;
      padding: 1px 5px !important;
      border-radius: 8px !important;
    }

    input[type="range"] {
      height: 16px !important;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 5px !important;
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 15px !important;
      height: 15px !important;
      margin-top: -6px !important;
      border-width: 2px !important;
    }

    .row {
      font-size: 6px !important;
      line-height: 1 !important;
      margin-top: 0 !important;
      opacity: .55 !important;
    }

    .buttons-dock {
      position: static !important;
      left: auto !important;
      right: auto !important;
      bottom: auto !important;
      margin: 3px auto 0 auto !important;
      padding: 3px !important;
      border-radius: 9px !important;
      display: block !important;
      z-index: auto !important;
      background: rgba(11,11,11,.82) !important;
      border: 1px solid rgba(255,255,255,.10) !important;
    }

    .buttons-row {
      gap: 5px !important;
    }

    .button,
    .knob-button,
    .button-a,
    .button-b {
      min-height: 30px !important;
      height: 30px !important;
      font-size: 10px !important;
      line-height: 1 !important;
      padding: 0 !important;
      border-radius: 9px !important;
    }

    .knob-button {
      font-size: 13px !important;
      letter-spacing: .04em !important;
    }

  
    /* AB page cleanup: logo and baseline are handled by remote_window.py */
    .brand-banner,
    .cl-audio-shell,
    .status,
    .small {
      display: none !important;
      height: 0 !important;
      min-height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      overflow: hidden !important;
    }

    body {
      padding: 0 8px 0 8px !important;
      overflow: hidden !important;
    }

    .wrap {
      padding-top: 0 !important;
      gap: 4px !important;

        inset 0 -8px 18px rgba(0, 0, 0, .30),
        0 8px 20px rgba(0, 0, 0, .28) !important;
    }

    .slider-panel {
      position: relative !important;
      margin-top: 0 !important;
      padding: 12px 14px 5px !important;
      border: 1px solid rgba(148, 163, 184, .28) !important;

        linear-gradient(180deg, rgba(5, 7, 11, .96), rgba(22, 27, 35, .94)) !important;
      box-shadow:
        inset 0 2px 8px rgba(0, 0, 0, .82),
        inset 0 0 0 1px rgba(255, 255, 255, .025) !important;
    }

    input[type="range"] {
      height: 36px !important;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px !important;
      border: 1px solid rgba(0, 0, 0, .92) !important;
      border-radius: 3px !important;
      background:
        linear-gradient(
          90deg,
          #8c45d9 0%,
          #53627a 46%,
          #d7dee8 50%,
          #6f6246 54%,
          #f0b51f 100%
        ) !important;
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, .78),
        0 1px 0 rgba(255, 255, 255, .10) !important;
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 22px !important;
      height: 34px !important;
      margin-top: -14px !important;
      border: 1px solid #f8fafc !important;

      background:
        linear-gradient(
          90deg,
          #6f7782 0%,
          #e8edf3 25%,
          #ffffff 48%,

          #59616c 100%
        ) !important;
      box-shadow:
        0 5px 12px rgba(0, 0, 0, .62),
        0 0 0 3px rgba(185, 197, 211, .12),
        inset 0 0 0 2px rgba(255, 255, 255, .28) !important;
    }

    input[type="range"]::-moz-range-track {
      height: 8px;
      border: 1px solid rgba(0, 0, 0, .92);
      border-radius: 3px;
      background: linear-gradient(90deg, #8c45d9, #53627a 46%, #d7dee8 50%, #6f6246 54%, #f0b51f);
    }

    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 34px;
      border: 1px solid #f8fafc;
      border-radius: 5px;
      background: linear-gradient(90deg, #6f7782, #e8edf3 25%, #fff 48%, #aeb7c3 72%, #59616c);
      box-shadow: 0 5px 12px rgba(0, 0, 0, .62);

      font-family: "SF Mono", "Roboto Mono", Menlo, monospace !important;

    @media screen and (max-width: 430px) and (orientation: portrait) {
      body:not(.desktop-embed) .transport-dock {
        min-height: 62px !important;
        padding: 4px !important;
      }

      body:not(.desktop-embed) .transport-row .button-pause,
      body:not(.desktop-embed) .transport-row .knob-button {
        height: 56px !important;
        min-height: 56px !important;
      }

      body:not(.desktop-embed) .transport-row .button-pause {

      }

      body:not(.desktop-embed) .transport-row .knob-button {
        font-size: 25px !important;
      }

      body:not(.desktop-embed) .crossfader-section {
        width: 100% !important;
        padding: 7px 8px 6px !important;
      }
    }
</style>
</head>
<body>
  
  <main class="wrap">
    <div class="status disconnected" id="status">Connexion…</div>

    <div class="paradis-brand" aria-label="Paradis Latin Cabaret">
      <img src="/assets/paradis%20latin.jpg" alt="Paradis Latin Cabaret">
    </div>

    <nav class="topnav" aria-label="Navigation de la télécommande">
      <a href="/">Session</a>
      <a href="/ab" class="active" aria-current="page">A/B</a>
      <a href="/arrangement" data-arrangement-link>Arrangement</a>
    </nav>



    <section class="card deck-screen" id="abNowCard" aria-live="polite">
      <div class="display-stack">
        <div class="title-box title-box-current" id="currentTitleCard">
          <div class="now-label">TITRE EN COURS</div>
          <div class="now-title" id="abCurrentTitle">—</div>
          <div class="current-remaining" id="abRemaining">Temps restant · --:--</div>
        </div>
        <div class="arrow" aria-hidden="true">↓</div>
        <div class="title-box title-box-next" id="nextTitleCard">
          <div class="now-label">PROCHAIN</div>
          <div class="next-title" id="abNextTitle">—</div>
          <div class="next-duration" id="abNextDuration">Durée · --:--</div>
        </div>
        <div class="counter" id="abCounter" style="display:none;">—</div>
      </div>
    </section>

    <section class="scene-select-panel" aria-label="Sélecteur de titre">
      <select class="scene-select" id="abSceneSelect" aria-label="Choisir un titre">
        <option value="">Choisir…</option>
      </select>
    </section>

    <section class="transport-dock" aria-label="Commandes de transport Ableton">
      <div class="transport-row">
        <button class="button button-pause" id="abPauseResume" type="button" aria-label="Pause ou reprendre la lecture">PAUSE</button>
        <button class="knob-button" id="abSceneConfirm" type="button">GO</button>
      </div>
    </section>

    <section class="crossfader-section" aria-live="polite" aria-label="Crossfader Ableton">
      <div class="crossfader-label">Crossfader Ableton</div>
      <div class="crossfader-position" id="position">—</div>
      <div class="slider-panel" aria-label="Réglage progressif A/B">
        <input id="xfader" type="range" min="-1" max="1" step="0.01" value="0" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0" aria-label="Crossfader slider">
        <div class="row"><span>A</span><span>Centre</span><span>B</span></div>
      </div>
    </section>

    <section class="buttons-dock" aria-label="Commandes A/B Ableton">
      <div class="buttons-row xfade-buttons">
        <button class="button button-a" data-target="a" type="button">A</button>
        <button class="button button-b" data-target="b" type="button">B</button>
      </div>
    </section>


    <div class="small">Interface verrouillée : A / B / sélection titre uniquement.</div>
  </main>

  <script>
    document.body.classList.toggle('desktop-embed', new URLSearchParams(window.location.search).get('desktop') === '1');
    const statusEl = document.getElementById('status');
    const abNowCardEl = document.getElementById('abNowCard');
    const abCurrentTitleEl = document.getElementById('abCurrentTitle');
    const abRemainingEl = document.getElementById('abRemaining');
    const abNextTitleEl = document.getElementById('abNextTitle');
    const abNextDurationEl = document.getElementById('abNextDuration');
    const nextTitleCardEl = document.getElementById('nextTitleCard');
    const abCounterEl = document.getElementById('abCounter');
    const abSceneSelectEl = document.getElementById('abSceneSelect');
    const abSceneConfirmEl = document.getElementById('abSceneConfirm');
    const abPauseResumeEl = document.getElementById('abPauseResume');
    const positionEl = document.getElementById('position');
    const buttons = [...document.querySelectorAll('button[data-target]')];
    const slider = document.getElementById('xfader');
    let busy = false;
    let sliderTimer = null;
    let sliderDragging = false;
    let lastSceneSelectSignature = '';
    let userSceneChoiceDirty = false;
    let preparedNextScene = null;
    let abletonSelectedScene = null;
    let lastKnownAbState = null;
    let lastAcceptedGeneration = -1;

    function resetAbUiForGeneration() {
      preparedNextScene = null;
      abletonSelectedScene = null;
      lastKnownAbState = null;
      userSceneChoiceDirty = false;
      lastSceneSelectSignature = '';

      abCurrentTitleEl.textContent = '—';
      if (abRemainingEl) abRemainingEl.textContent = 'Temps restant · --:--';
      abNextTitleEl.textContent = '—';
      if (abNextDurationEl) abNextDurationEl.textContent = 'Durée · --:--';
      if (abCounterEl) abCounterEl.textContent = '';
      if (abSceneSelectEl) {
        abSceneSelectEl.innerHTML = '<option value="">Choisir…</option>';
        abSceneSelectEl.value = '';
      }
      if (abNowCardEl) abNowCardEl.classList.remove('is-playing', 'state-playing', 'state-paused');
      if (nextTitleCardEl) {
        nextTitleCardEl.classList.remove('is-prepared', 'state-playing', 'is-imminent', 'state-paused');
        nextTitleCardEl.dataset.nextState = '';
      }
      abNextTitleEl.classList.remove('is-prepared');
    }

    function acceptStateGeneration(state) {
      const generation = Number(state && state.set_generation);
      if (!Number.isInteger(generation) || generation < lastAcceptedGeneration) {
        if (state && state.generation_debug) {
          console.warn('[SET_GENERATION] stale_response_rejected', {
            interface: 'ab', received: generation, current: lastAcceptedGeneration
          });
        }
        return false;
      }
      if (generation > lastAcceptedGeneration) {
        if (state && state.generation_debug) {
          console.info('[SET_GENERATION] generation_accepted', {
            interface: 'ab', previous: lastAcceptedGeneration, generation
          });
        }
        lastAcceptedGeneration = generation;
        resetAbUiForGeneration();
      }
      return true;
    }

    function newRequestId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      return `go-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function setStatus(text, connected) {
      statusEl.textContent = text;
      statusEl.classList.toggle('connected', connected);
      statusEl.classList.toggle('disconnected', !connected);
    }

    function labelForValue(value, label) {
      if (label) return label;
      const v = Number(value || 0);
      if (v <= -0.95) return 'A';
      if (v >= 0.95) return 'B';
      return 'Centre';
    }

    function pickFirstString(...values) {
      for (const value of values) {
        if (typeof value === 'string' && value.trim()) return value.trim();
        if (value && typeof value === 'object') {
          for (const key of ['name', 'title', 'label']) {
            if (typeof value[key] === 'string' && value[key].trim()) return value[key].trim();
          }
        }
      }
      return '';
    }

    function cleanTitle(value) {
      const raw = value && value !== '—' ? String(value).trim() : '';
      if (!raw) return '—';
      return raw.split(';')[0].trim() || raw;
    }

    function fillSceneSelectFromState(state) {
      if (!abSceneSelectEl || !state || !state.scenes) return;

      const entries = Object.entries(state.scenes)
        .filter(([, name]) => name && String(name).trim())
        .sort((a, b) => Number(a[0]) - Number(b[0]));

      const signature = JSON.stringify(entries);
      const userIsChoosing = document.activeElement === abSceneSelectEl;
      if (userIsChoosing) return;
      if (signature !== lastSceneSelectSignature || abSceneSelectEl.options.length <= 1) {
        abSceneSelectEl.innerHTML = '<option value="">Choisir…</option>';
        entries.forEach(([index, rawName]) => {
          const option = document.createElement('option');
          option.value = String(Number(index) + 1);
          option.dataset.rawName = rawName;
          option.textContent = `${Number(index) + 1} · ${cleanTitle(rawName)}`;
          abSceneSelectEl.appendChild(option);
        });
        lastSceneSelectSignature = signature;
      }

      const preferredValue = userSceneChoiceDirty && preparedNextScene !== null
        ? String(preparedNextScene)
        : '';

      if (preferredValue && [...abSceneSelectEl.options].some(option => option.value === preferredValue)) {
        abSceneSelectEl.value = preferredValue;
      } else if (!userSceneChoiceDirty && abletonSelectedScene !== null) {
        const nextValue = String(abletonSelectedScene);
        if ([...abSceneSelectEl.options].some(option => option.value === nextValue)) {
          abSceneSelectEl.value = nextValue;
        }
      }
    }

    function previewSceneSelect(markUserChoice = false) {
      if (!abSceneSelectEl || !abNextTitleEl) return;
      const option = abSceneSelectEl.options[abSceneSelectEl.selectedIndex];
      if (!option || !option.value) return;

      if (markUserChoice) {
        const selected = Number.parseInt(option.value, 10);
        if (Number.isInteger(selected) && selected > 0) {
          userSceneChoiceDirty = true;
          preparedNextScene = selected;
        }
      }

      const rawName = option.dataset.rawName || option.textContent || '';
      abNextTitleEl.textContent = cleanTitle(rawName);
      if (abNextDurationEl) {
        abNextDurationEl.textContent = `Durée · ${selectedSceneDuration(
          lastKnownAbState,
          option.value,
          rawName
        )}`;
      }
      abNextTitleEl.classList.add('is-prepared');
      if (nextTitleCardEl) {
        nextTitleCardEl.classList.add('is-prepared');
        nextTitleCardEl.classList.remove('state-playing', 'is-imminent', 'state-paused');
        nextTitleCardEl.dataset.nextState = 'ready';
      }
    }

    function formatRemainingSeconds(value) {
      const seconds = Number(value);
      if (!Number.isFinite(seconds) || seconds < 0) return '--:--';
      const rounded = Math.max(0, Math.ceil(seconds));
      const minutes = Math.floor(rounded / 60);
      const remainder = rounded % 60;
      return `${minutes}:${String(remainder).padStart(2, '0')}`;
    }

    function durationFromSceneName(value) {
      const raw = String(value || '').trim();
      const match = raw.match(/(?:^|;)\s*(\d{1,2}:\d{2}(?::\d{2})?)\s*$/);
      return match ? match[1] : '--:--';
    }

    function selectedSceneDuration(state, sceneNumber, rawName) {
      const sceneIndex = Number(sceneNumber) - 1;
      const publishedIndex = Number(state && state.selected_scene_duration_index);
      const publishedDuration = Number(state && state.selected_scene_duration_seconds);
      if (
        Number.isInteger(sceneIndex) &&
        sceneIndex === publishedIndex &&
        Number.isFinite(publishedDuration) &&
        publishedDuration >= 0
      ) {
        return formatRemainingSeconds(Math.round(publishedDuration));
      }
      return durationFromSceneName(rawName);
    }

    function advanceSceneSelectAfterGo(sceneNumber) {
      if (!abSceneSelectEl || !abNextTitleEl) return;
      const nextValue = String(sceneNumber + 1);
      const nextOption = [...abSceneSelectEl.options].find(option => option.value === nextValue);

      if (!nextOption) {
        preparedNextScene = null;
        userSceneChoiceDirty = false;
        abNextTitleEl.classList.remove('is-prepared');
        if (nextTitleCardEl) {
          nextTitleCardEl.classList.remove('is-prepared', 'state-playing', 'is-imminent');
          nextTitleCardEl.classList.add('state-paused');
          nextTitleCardEl.dataset.nextState = 'paused';
        }
        return;
      }

      abSceneSelectEl.value = nextValue;
      abSceneSelectEl.dispatchEvent(new Event('change', { bubbles:true }));
      preparedNextScene = sceneNumber + 1;
      userSceneChoiceDirty = false;

      const rawName = nextOption.dataset.rawName || nextOption.textContent || '';
      abNextTitleEl.textContent = cleanTitle(rawName);
      if (abNextDurationEl) {
        abNextDurationEl.textContent = `Durée · ${selectedSceneDuration(
          lastKnownAbState,
          nextOption.value,
          rawName
        )}`;
      }
      abNextTitleEl.classList.add('is-prepared');
      if (nextTitleCardEl) nextTitleCardEl.classList.add('is-prepared');
    }

    function deepFindString(source, wantedKeys, depth = 0) {
      if (!source || typeof source !== 'object' || depth > 3) return '';
      for (const key of wantedKeys) {
        const direct = source[key];
        const picked = pickFirstString(direct);
        if (picked) return picked;
      }
      for (const value of Object.values(source)) {
        if (value && typeof value === 'object' && !Array.isArray(value)) {
          const found = deepFindString(value, wantedKeys, depth + 1);
          if (found) return found;
        }
      }
      return '';
    }

    function applyStatus(state) {
      if (!acceptStateGeneration(state)) return;
      lastKnownAbState = state;
      const connected = Boolean(state && state.connected);
      setStatus((connected ? '● ' : '○ ') + ((state && state.message) || (connected ? 'Connecté' : 'Interface non connectée')), connected);

      const selectedSceneIndex = Number(state && state.selected_scene);
      if (Number.isInteger(selectedSceneIndex) && selectedSceneIndex >= 0) {
        abletonSelectedScene = selectedSceneIndex + 1;
      }
      fillSceneSelectFromState(state);

      const rawMode = String(
        (state && (
          state.play_mode ||
          state.mode ||
          state.view ||
          state.current_mode ||
          state.transport_mode
        )) || ''
      ).toLowerCase();

      const modeIsArrangement = rawMode.includes('arrangement');
      const modeIsSession = rawMode.includes('session');

      const inferredArrangement = !modeIsSession && Boolean(state && (
        state.arrangement_marker ||
        state.current_marker ||
        state.current_locator_name ||
        state.current_locator ||
        state.locator_name
      ));

      const inferredSession = !modeIsArrangement && Boolean(state && (
        state.current_scene_name ||
        state.session_current_scene ||
        state.current_scene ||
        state.playing_scene_name ||
        state.active_scene_name
      ));

      const looksArrangement = modeIsArrangement || inferredArrangement;
      const looksSession = modeIsSession || inferredSession;

      const scenes = state && state.scenes ? state.scenes : null;
      const playingSceneIndex = Number(state && state.playing_scene);
      const lastFiredSceneIndex = Number(state && state.last_fired_scene);

      const sceneNameByIndex = index => {
        if (!scenes || !Number.isInteger(index) || index < 0) return '';
        return scenes[String(index)] || scenes[index] || '';
      };

      const selectedSceneFromMap = sceneNameByIndex(selectedSceneIndex);
      const playingSceneFromMap = sceneNameByIndex(playingSceneIndex);
      const lastFiredSceneFromMap = sceneNameByIndex(lastFiredSceneIndex);

      const modeLabel = looksArrangement
        ? 'MODE ARRANGEMENT'
        : (looksSession ? 'MODE SESSION' : 'MODE —');

      const sessionTitle = state && state.has_show_started ? pickFirstString(
        playingSceneFromMap,
        lastFiredSceneFromMap,
        state && state.playing_scene_name,
        state && state.last_fired_scene_name,
        state && state.current_scene_name,
        state && state.session_current_scene,
        state && state.current_scene,
        state && state.active_scene_name,
        state && state.current_scene_title,
        selectedSceneFromMap,
        deepFindString(state, ['current_scene_name', 'session_current_scene', 'playing_scene_name', 'last_fired_scene_name', 'active_scene_name', 'current_scene_title', 'current_scene'])
      ) : '';

      const arrangementTitle = pickFirstString(
        state && state.arrangement_marker,
        state && state.current_marker,
        state && state.current_locator_name,
        state && state.current_locator,
        state && state.locator_name,
        state && state.marker_name,
        deepFindString(state, ['arrangement_marker', 'current_marker', 'current_locator_name', 'current_locator', 'locator_name', 'marker_name'])
      );

      const currentTitleRaw = looksArrangement
        ? (arrangementTitle || sessionTitle || '—')
        : (sessionTitle || arrangementTitle || '—');
      const currentTitle = cleanTitle(currentTitleRaw);

      // Next title: try to find next scene or marker
      let nextTitleRaw = '';
      if (looksSession) {
        nextTitleRaw = pickFirstString(
          selectedSceneFromMap,
          state && state.selected_scene_name,
          state && state.next_scene_name,
          state && state.next_scene,
          state && state.upcoming_scene_name,
          state && state.upcoming_scene,
          state && state.next_scene_title
        );
      }
      if (!nextTitleRaw && looksArrangement) {
        nextTitleRaw = pickFirstString(
          state && state.next_marker,
          state && state.next_locator_name,
          state && state.next_locator,
          state && state.next_marker_name
        );
      }
      let nextTitle = cleanTitle(nextTitleRaw) || '—';

      // If the dropdown has a prepared next title, it has priority over Ableton's selected scene.
      // This prevents the periodic /status refresh from reverting PROCHAIN to the currently playing title.
      if (abSceneSelectEl && abNextTitleEl) {
        const selectedOption = abSceneSelectEl.options[abSceneSelectEl.selectedIndex];
        if (selectedOption && selectedOption.value) {
          const rawPreparedName = selectedOption.dataset.rawName || selectedOption.textContent || '';
          nextTitle = cleanTitle(rawPreparedName) || nextTitle;
          nextTitleRaw = rawPreparedName || nextTitleRaw;
        }
      }

      if (abCurrentTitleEl) abCurrentTitleEl.textContent = currentTitle;
      if (abRemainingEl) {
        abRemainingEl.textContent = `Temps restant · ${formatRemainingSeconds(
          state && state.remaining_seconds
        )}`;
      }
      if (abNextTitleEl) abNextTitleEl.textContent = nextTitle;
      if (abNextDurationEl) {
        const selectedOption = abSceneSelectEl && abSceneSelectEl.options[abSceneSelectEl.selectedIndex];
        const selectedValue = selectedOption && selectedOption.value
          ? selectedOption.value
          : String(Number(state && state.selected_scene) + 1);
        abNextDurationEl.textContent = `Durée · ${selectedSceneDuration(
          state,
          selectedValue,
          nextTitleRaw
        )}`;
      }
      if (abNextTitleEl && nextTitleCardEl) {
        const transportIsPlaying = Boolean(state && state.is_playing) && !Boolean(state && state.is_paused);
        const remainingRaw = state && state.remaining_seconds;
        const remainingSeconds = Number(remainingRaw);
        const hasReliableCountdown = remainingRaw !== null && remainingRaw !== '' && typeof remainingRaw !== 'undefined' && Number.isFinite(remainingSeconds) && remainingSeconds >= 0;
        const nextState = userSceneChoiceDirty
          ? 'ready'
          : (transportIsPlaying
              ? (hasReliableCountdown && remainingSeconds <= 10 ? 'imminent' : 'playing')
              : 'paused');

        nextTitleCardEl.classList.toggle('is-prepared', nextState === 'ready');
        nextTitleCardEl.classList.toggle('state-playing', nextState === 'playing');
        nextTitleCardEl.classList.toggle('is-imminent', nextState === 'imminent');
        nextTitleCardEl.classList.toggle('state-paused', nextState === 'paused');
        abNextTitleEl.classList.toggle('is-prepared', nextState !== 'paused');
        nextTitleCardEl.dataset.nextState = nextState;
      }
      const currentTitleCard = document.getElementById('currentTitleCard');
      if (currentTitleCard) {
        const isPlaying = Boolean(state && state.is_playing);
        const isPaused = Boolean(state && state.is_paused);
        const sessionJustLaunched = !isPaused && looksSession && (
          Number.isInteger(playingSceneIndex) && playingSceneIndex >= 0 ||
          Number.isInteger(lastFiredSceneIndex) && lastFiredSceneIndex >= 0
        );
        currentTitleCard.classList.toggle('is-playing', isPlaying || sessionJustLaunched);
      }
      if (abPauseResumeEl) {
        const isPlaying = Boolean(state && state.is_playing);
        if (!abTransportBusy && abPendingDesiredPlaying === null) {
          abDesiredPlaying = isPlaying;
        }
        abPauseResumeEl.textContent = isPlaying ? 'PAUSE' : 'REPRENDRE';
        abPauseResumeEl.classList.toggle('is-paused', !isPlaying);
        abPauseResumeEl.setAttribute('aria-label', isPlaying ? 'Mettre la lecture en pause' : 'Reprendre la lecture');
      }

      if (looksSession) {
        if (abCounterEl) {
          abCounterEl.style.display = 'block';
          abCounterEl.textContent = state && typeof state.remaining_time === 'string' ? state.remaining_time : '—';
        }
      } else {
        if (abCounterEl) {
          abCounterEl.style.display = 'none';
          abCounterEl.textContent = '';
        }
      }

      const value = Number(state && typeof state.crossfader !== 'undefined' ? state.crossfader : slider.value);
      if (!sliderDragging) {
        positionEl.textContent = labelForValue(value, state && state.crossfader_label);
        if (!Number.isNaN(value)) slider.value = value;
      }
    }

    async function fetchJSON(url, options = {}, timeoutMs = 2500) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, {...options, cache:'no-store', signal:controller.signal});
        let data = null;
        try { data = await res.json(); } catch (_) {}
        if (!res.ok) throw new Error((data && data.message) || 'Erreur serveur');
        return data;
      } finally { clearTimeout(timeout); }
    }

    async function update() {
      if (busy) return;
      try { applyStatus(await fetchJSON('/status', {}, 1800)); }
      catch (_) { setStatus('○ Interface non connectée', false); }
    }

    async function sendXfade(payload) {
      if (busy) return;
      busy = true;
      try {
        buttons.forEach(b => b.disabled = true);
        setStatus('● Envoi A/B…', true);
        const data = await fetchJSON('/action', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}, 2200);
        if (data && data.state) applyStatus(data.state); else await update();
      } catch (_) {
        setStatus('○ Commande A/B impossible', false);
      } finally {
        setTimeout(() => { buttons.forEach(b => b.disabled = false); busy = false; }, 180);
      }
    }

    async function confirmSelectedScene() {
      if (!abSceneSelectEl) return;

      let sceneNumber = Number.parseInt(abSceneSelectEl.value, 10);
      if (!Number.isInteger(sceneNumber) || sceneNumber < 1) {
        sceneNumber = Number.parseInt(preparedNextScene, 10);
      }
      if (!Number.isInteger(sceneNumber) || sceneNumber < 1) {
        sceneNumber = Number.parseInt(abletonSelectedScene, 10);
      }

      if (!Number.isInteger(sceneNumber) || sceneNumber < 1) {
        setStatus('○ Choisis un titre', false);
        return;
      }

      const option = [...abSceneSelectEl.options].find(opt => Number.parseInt(opt.value, 10) === sceneNumber);
      const rawName = option && option.dataset ? option.dataset.rawName : (option ? option.textContent : '');
      if (rawName && abNextTitleEl) abNextTitleEl.textContent = cleanTitle(rawName);

      try {
        setStatus('● GO titre…', true);
        const goData = await fetchJSON('/action', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            action:'go',
            request_id:newRequestId(),
            set_generation:lastAcceptedGeneration,
            scene:sceneNumber
          })
        }, 2200);

        if (goData && goData.state) applyStatus(goData.state);
        else await update();

        // Prepare next scene for the next GO.
        advanceSceneSelectAfterGo(sceneNumber);
        setStatus('● Titre lancé — prochain titre préparé', true);
      } catch (_) {
        setStatus('○ Sélection impossible', false);
      }
    }

    if (abSceneSelectEl) {
      abSceneSelectEl.addEventListener('change', () => previewSceneSelect(true));
      abSceneSelectEl.addEventListener('input', () => previewSceneSelect(true));
    }

    if (abSceneConfirmEl) {
      abSceneConfirmEl.addEventListener('click', confirmSelectedScene);
    }

    buttons.forEach(button => button.addEventListener('click', () => {
      sendXfade({action:'xfade', target:button.dataset.target});
    }));

    if (abPauseResumeEl) {
      abPauseResumeEl.addEventListener('click', togglePlayPauseFromKeyboard);
    }

    function sendSliderValue(delay = 40) {
      positionEl.textContent = labelForValue(slider.value);
      clearTimeout(sliderTimer);
      sliderTimer = setTimeout(() => {
        sendXfade({action:'xfade_value', value:Number(slider.value)});
      }, delay);
    }

    slider.addEventListener('pointerdown', () => {
      sliderDragging = true;
    });

    slider.addEventListener('pointerup', () => {
      sliderDragging = false;
      sendSliderValue(0);
    });

    slider.addEventListener('pointercancel', () => {
      sliderDragging = false;
      sendSliderValue(0);
    });

    slider.addEventListener('touchend', () => {
      sliderDragging = false;
      sendSliderValue(0);
    });

    slider.addEventListener('input', () => {
      sliderDragging = true;
      sendSliderValue(40);
    });

    slider.addEventListener('change', () => {
      sliderDragging = false;
      sendSliderValue(0);
    });


    function movePreparedScene(delta) {
      if (!abSceneSelectEl || abSceneSelectEl.options.length <= 1) return;

      const options = [...abSceneSelectEl.options].filter(option => option.value);
      if (!options.length) return;

      const currentIndex = options.findIndex(option => option.value === abSceneSelectEl.value);
      const safeIndex = currentIndex >= 0 ? currentIndex : 0;
      const nextIndex = Math.max(0, Math.min(options.length - 1, safeIndex + delta));
      const nextOption = options[nextIndex];
      if (!nextOption) return;

      abSceneSelectEl.value = nextOption.value;
      abSceneSelectEl.dispatchEvent(new Event('change', { bubbles: true }));
      previewSceneSelect(true);
    }

    let abDesiredPlaying = null;
    let abTransportBusy = false;
    let abPendingDesiredPlaying = null;

    async function togglePlayPauseFromKeyboard(desiredPlayingOverride = null) {
      const currentPlaying = abPendingDesiredPlaying !== null
        ? abPendingDesiredPlaying
        : (
            abDesiredPlaying === null
              ? Boolean(
                  abPauseResumeEl &&
                  abPauseResumeEl.textContent.trim().toUpperCase() === 'PAUSE'
                )
              : abDesiredPlaying
          );

      const desiredPlaying =
        typeof desiredPlayingOverride === 'boolean'
          ? desiredPlayingOverride
          : !currentPlaying;

      abDesiredPlaying = desiredPlaying;

      if (abPauseResumeEl) {
        abPauseResumeEl.textContent = desiredPlaying ? 'PAUSE' : 'REPRENDRE';
        abPauseResumeEl.classList.toggle('is-paused', !desiredPlaying);
        abPauseResumeEl.setAttribute(
          'aria-label',
          desiredPlaying
            ? 'Mettre la lecture en pause'
            : 'Reprendre la lecture'
        );
      }

      if (abTransportBusy) {
        abPendingDesiredPlaying = desiredPlaying;

        setStatus(
          desiredPlaying
            ? '● Lecture demandée…'
            : '● Pause demandée…',
          true
        );

        return;
      }

      abTransportBusy = true;

      try {
        setStatus('● Lecture / pause…', true);

        const data = await fetchJSON('/action', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            action: 'pause',
            desired_playing: desiredPlaying
          })
        }, 1800);

        if (data && data.state) applyStatus(data.state);
        else await update();
      } catch (_) {
        setStatus('○ Lecture / pause impossible', false);
      } finally {
        abTransportBusy = false;

        if (abPendingDesiredPlaying !== null) {
          const queuedDesired = abPendingDesiredPlaying;
          abPendingDesiredPlaying = null;

          window.setTimeout(() => {
            togglePlayPauseFromKeyboard(queuedDesired);
          }, 0);
        }
      }
    }

    function keyboardShortcutBlockReason(event) {
      if (event.repeat) return 'key-repeat';
      if (event.metaKey || event.altKey || event.ctrlKey) return 'modifier-key';
      const target = event.target instanceof Element ? event.target : document.activeElement;
      if (!target) return '';
      return (
        target.matches('input, textarea, select, [contenteditable]:not([contenteditable="false"])') ||
        target.closest('[contenteditable]:not([contenteditable="false"])')
      ) ? `editable-focus:${target.tagName || 'contenteditable'}` : '';
    }

    function keyboardDiagnosticLog(eventName, details = {}) {
      const record = { source: 'AB', event: eventName, ...details };
      console.info(`[KEYBOARD][AB] ${eventName}`, record);
      fetch('/keyboard-log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(record),
        keepalive: true
      }).catch(() => {});
    }

    keyboardDiagnosticLog('initialized', {
      diagnosticCase: 'INITIALIZED_CASE_4_EXCLUDED',
      timestamp: Date.now(),
      readyState: document.readyState,
      inIframe: window.top !== window,
      documentHasFocus: document.hasFocus(),
      windowHasFocus: typeof window.hasFocus === 'function' ? window.hasFocus() : document.hasFocus()
    });

    document.addEventListener('keydown', event => {
      const reason = keyboardShortcutBlockReason(event) || (busy ? 'busy' : '');
      keyboardDiagnosticLog('keydown', {
        diagnosticCase: reason ? 'CASE_2_REJECTED' : 'KEYDOWN_ACCEPTED',
        timestamp: Date.now(),
        key: event.key,
        code: event.code,
        repeat: event.repeat,
        target: event.target && event.target.tagName,
        activeElement: document.activeElement && document.activeElement.tagName,
        activeElementId: document.activeElement && document.activeElement.id,
        documentHasFocus: document.hasFocus(),
        windowHasFocus: typeof window.hasFocus === 'function' ? window.hasFocus() : document.hasFocus(),
        ignored: Boolean(reason),
        reason
      });
      if (reason) return;

      if (event.key === 'Enter') {
        event.preventDefault();
        event.stopPropagation();
        keyboardDiagnosticLog('invoke-go', { diagnosticCase: 'CASE_3_HANDLER_CALLED', timestamp: Date.now() });
        confirmSelectedScene();
        return;
      }

      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        movePreparedScene(-1);
        return;
      }

      if (event.key === 'ArrowRight') {
        event.preventDefault();
        movePreparedScene(1);
        return;
      }

      if (event.code === 'Space' || event.key === ' ') {
        event.preventDefault();
        event.stopPropagation();
        keyboardDiagnosticLog('invoke-play-pause', { diagnosticCase: 'CASE_3_HANDLER_CALLED', timestamp: Date.now() });
        togglePlayPauseFromKeyboard();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      window.CLRemoteEnergy.startPolling(
        update,
        () => document.body.classList.contains('v2-playing'),
        { activeMs: 40, idleMs: 2000, hiddenMs: 15000, minActiveMs: 40 }
      );
    }, { once: true });
  </script>
</body>
</html>
